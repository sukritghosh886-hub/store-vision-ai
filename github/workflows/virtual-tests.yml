name: Store Vision AI Virtual Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  virtual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run virtual environment tests
        env:
          YOLO_CONFIG_DIR: /tmp/Ultralytics
        run: |
          python virtual_test.py